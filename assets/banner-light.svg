<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-label="Oleksii Iovchev, Backend Lead">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#7c3aed"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="42"/></filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#94a3b8" opacity="0.55"/>
    </pattern>
    <clipPath id="frame"><rect width="900" height="230" rx="18"/></clipPath>
  </defs>
  <style>
    .blob { opacity: 0.28; transform-box: fill-box; transform-origin: center; }
    .b1 { animation: drift1 16s ease-in-out infinite alternate; }
    .b2 { animation: drift2 20s ease-in-out infinite alternate; }
    .b3 { animation: drift3 18s ease-in-out infinite alternate; }
    @keyframes drift1 { to { transform: translate(120px, 30px) scale(1.15); } }
    @keyframes drift2 { to { transform: translate(-140px, -20px) scale(0.9); } }
    @keyframes drift3 { to { transform: translate(60px, -40px) scale(1.2); } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .fade { opacity: 0; animation: fadein 0.9s ease-out forwards; }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.45s; } .d3 { animation-delay: 0.8s; }
    @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    @media (prefers-reduced-motion: reduce) { .fade { opacity: 1; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="900" height="230" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <circle class="blob b1" cx="150" cy="60" r="110" fill="#7c3aed"/>
      <circle class="blob b2" cx="760" cy="170" r="120" fill="#0891b2"/>
      <circle class="blob b3" cx="520" cy="20" r="80" fill="#7c3aed"/>
    </g>
    <rect width="900" height="230" fill="url(#dots)"/>
    <rect x="0.5" y="0.5" width="899" height="229" rx="18" fill="none" stroke="#d0d7de" stroke-opacity="0.8"/>
    <g font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Liberation Mono', monospace" font-size="16" fill="#57606a" class="fade d1">
      <text x="56" y="70">~/alekseyiovchev <tspan fill="#0891b2">$</tspan> whoami<tspan class="cursor" fill="#7c3aed"> ▍</tspan></text>
    </g>
    <text x="54" y="132" font-family="'Segoe UI', Ubuntu, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="700" fill="url(#name)" class="fade d2">Oleksii Iovchev</text>
    <text x="57" y="175" font-family="'Segoe UI', Ubuntu, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#1f2937" class="fade d3">Backend Lead <tspan fill="#57606a">·</tspan> Python <tspan fill="#57606a">·</tspan> Distributed systems <tspan fill="#57606a">·</tspan> a bit of Rust</text>
  </g>
</svg>
