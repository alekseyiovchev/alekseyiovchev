<svg xmlns="http://www.w3.org/2000/svg" width="300" height="392" viewBox="0 0 300 392" role="img" aria-label="request, api, queue, worker, db: at-least-once delivery with retries, idempotent write">
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.45"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#a78bfa"/>
    </marker>
    <clipPath id="frame"><rect width="300" height="392" rx="16"/></clipPath>
  </defs>
  <style>
    .node { animation: hit 5.0s linear infinite; }
    @keyframes hit { 0% { stroke: #22d3ee; } 14% { stroke: #30363d; } 100% { stroke: #30363d; } }
    .ok { animation: ok 5.0s ease-out infinite; animation-delay: 4.00s; opacity: 0.35; }
    @keyframes ok { 0% { opacity: 1; } 60% { opacity: 1; } 100% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="300" height="392" fill="#0d1117"/>
    <rect width="300" height="392" fill="url(#dots)"/>
  </g>
  <rect x="0.5" y="0.5" width="299" height="391" rx="16" fill="none" stroke="#30363d"/>
  <text x="20" y="30" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#8b949e"># life of a request</text>
  <path d="M130 88.0 V122.0 M130 158.0 V192.0 M130 228.0 V262.0 M130 298.0 V332.0" stroke="#30363d" stroke-width="2" fill="none"/>
  <path id="loop" d="M205.0 280.0 H227.0 Q243.0 280.0 243.0 264.0 V226.0 Q243.0 210.0 227.0 210.0 H211.0" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4 4" fill="none" marker-end="url(#arrow)" opacity="0.8"/>
  <circle r="4.5" fill="#22d3ee">
    <animateMotion dur="5.0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.800;1" calcMode="linear" path="M130 70.0 V350.0"/>
  </circle>
  <circle r="4" fill="#a78bfa">
    <animateMotion dur="5.0s" begin="3.00s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.35;1" calcMode="linear"><mpath href="#loop"/></animateMotion>
  </circle>
  <g font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" fill="#e6edf3">
  <rect class="node" style="animation-delay:0.00s" x="55.0" y="52.0" width="150" height="36" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="130" y="75.0" text-anchor="middle">request</text>
  <rect class="node" style="animation-delay:1.00s" x="55.0" y="122.0" width="150" height="36" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="130" y="145.0" text-anchor="middle">api</text>
  <rect class="node" style="animation-delay:2.00s" x="55.0" y="192.0" width="150" height="36" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="130" y="215.0" text-anchor="middle">queue</text>
  <rect class="node" style="animation-delay:3.00s" x="55.0" y="262.0" width="150" height="36" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="130" y="285.0" text-anchor="middle">worker</text>
  <rect class="node" style="animation-delay:4.00s" x="55.0" y="332.0" width="150" height="36" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="130" y="355.0" text-anchor="middle">db</text>
  </g>
  <g font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#a78bfa">
    <text x="251.0" y="242.0">retry</text>
    <text x="251.0" y="256.0">+jitter</text>
  </g>
  <text x="138" y="249.0" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Liberation Mono', monospace" font-size="10" fill="#8b949e">at-least-once</text>
  <text class="ok" x="215.0" y="355.0" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="600" fill="#22d3ee">✓ idempotent</text>
</svg>
