<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200" role="img" aria-label="$ python whoami.py: Hi, I&#x27;m Oleksii Iovchev, backend lead. I build async services and message-driven workflows that stay boring in production.">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.10"/>
    </linearGradient>
    <clipPath id="frame"><rect width="720" height="200" rx="12"/></clipPath>
  </defs>
  <style>
    .out { animation: show 9s linear infinite; }
    @keyframes show { 0% { opacity: 0; } 3% { opacity: 1; } 92% { opacity: 1; } 100% { opacity: 0; } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="720" height="200" fill="#0d1117"/>
    <rect width="720" height="40" fill="url(#bar)"/>
  </g>
  <rect x="0.5" y="0.5" width="719" height="199" rx="12" fill="none" stroke="#30363d"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/><circle cx="44" cy="20" r="6" fill="#febc2e"/><circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text x="360.0" y="25" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#8b949e">~/alekseyiovchev — zsh</text>
  <g font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#e6edf3">
  <text x="28" y="78"><tspan fill="#22d3ee">$</tspan> python whoami.py</text>
  <text class="out" style="animation-delay:0.90s" x="28" y="104">Hi, I&#x27;m Oleksii Iovchev, backend lead.</text>
  <text class="out" style="animation-delay:1.35s" x="28" y="130">I build async services and message-driven</text>
  <text class="out" style="animation-delay:1.80s" x="28" y="156">workflows that stay boring in production.</text>
  <text x="28" y="182"><tspan fill="#22d3ee">$</tspan><tspan class="cursor" fill="#a78bfa"> ▍</tspan></text>
